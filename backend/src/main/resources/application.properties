# Vyom ERP backend. Settings come from the process environment first (docker compose sets them),
# then from a .env file next to the working directory or its parent (web-dashboard/.env when run
# from backend/), as before. The names are the ones in .env.example.
spring.application.name=vyom-erp
spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.main.banner-mode=off

server.port=${PORT:8080}
spring.threads.virtual.enabled=true

spring.datasource.url=${PG_URL}
spring.datasource.username=${PG_USER:postgres}
spring.datasource.password=${PG_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10

# /actuator/health only (database check included); nginx doesn't proxy it.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
