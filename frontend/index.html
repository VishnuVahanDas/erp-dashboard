<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#060b18" />
    <title>Vyom Drones ERP</title>
    <script>
      // Apply the saved theme before first paint (see ThemeToggle in src/ui.jsx).
      (function () {
        var t = 'system';
        try { t = localStorage.getItem('vyom_theme') || 'system'; } catch (e) {}
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
