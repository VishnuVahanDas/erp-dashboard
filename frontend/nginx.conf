server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # NB: nginx drops server-level add_header in any location that sets its
    # own, so every location includes the security headers explicitly.

    # API -> backend container (compose service "backend").
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/sync may wait up to 25 s for the Windows agent.
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change -> cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html (never cached).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
